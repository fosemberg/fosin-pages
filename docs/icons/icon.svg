<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- MUCKDIVERS app icon: a diver helmet with a glowing porthole above a cracked sea floor. Original art. -->
  <defs>
    <radialGradient id="sea" cx="50%" cy="28%" r="80%">
      <stop offset="0" stop-color="#16606b"/>
      <stop offset="0.45" stop-color="#0b3440"/>
      <stop offset="1" stop-color="#061019"/>
    </radialGradient>
    <radialGradient id="glass" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#f2fffc"/>
      <stop offset="0.28" stop-color="#9ff8ee"/>
      <stop offset="0.7" stop-color="#37f2df"/>
      <stop offset="1" stop-color="#0d7f78"/>
    </radialGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d6d78"/>
      <stop offset="1" stop-color="#0a2c35"/>
    </linearGradient>
    <linearGradient id="crack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd07a"/>
      <stop offset="0.5" stop-color="#ff5a4e"/>
      <stop offset="1" stop-color="#d7263d"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect id="bg" width="512" height="512" rx="104" fill="url(#sea)"/>

  <!-- light shafts from far above -->
  <g opacity="0.1" fill="#bffcf5">
    <path d="M150 0 L205 0 L150 330 L110 330 Z"/>
    <path d="M300 0 L335 0 L330 300 L300 300 Z"/>
    <path d="M395 0 L440 0 L470 280 L430 280 Z"/>
  </g>

  <!-- sea floor with a glowing crack -->
  <path d="M0 404 C70 386 120 408 190 398 C236 391 276 392 322 400 C390 412 440 392 512 402 L512 512 L0 512 Z" fill="#030a10"/>
  <path d="M252 398 L238 426 L258 446 L232 474 L246 512" fill="none" stroke="#ff5a4e" stroke-width="16" stroke-linejoin="bevel" filter="url(#soft)" opacity="0.75"/>
  <path d="M252 398 L238 426 L258 446 L232 474 L246 512" fill="none" stroke="url(#crack)" stroke-width="6" stroke-linejoin="bevel"/>
  <path d="M258 446 L292 458 L306 482 M238 426 L206 432 L190 452" fill="none" stroke="url(#crack)" stroke-width="3.5" stroke-linejoin="bevel"/>

  <!-- halo behind the helmet -->
  <ellipse cx="256" cy="230" rx="150" ry="150" fill="#37f2df" opacity="0.18" filter="url(#glow)"/>

  <!-- collar and bolts -->
  <path d="M146 322 Q256 350 366 322 L376 368 Q256 400 136 368 Z" fill="#0a2830" stroke="#37f2df" stroke-opacity="0.55" stroke-width="4"/>
  <g fill="#c8964a">
    <circle cx="168" cy="352" r="7"/>
    <circle cx="212" cy="364" r="7"/>
    <circle cx="256" cy="368" r="7"/>
    <circle cx="300" cy="364" r="7"/>
    <circle cx="344" cy="352" r="7"/>
  </g>

  <!-- dome -->
  <path d="M130 322 C116 170 188 96 256 96 C324 96 396 170 382 322 Q256 352 130 322 Z" fill="url(#dome)" stroke="#37f2df" stroke-width="5" stroke-opacity="0.9"/>
  <path d="M170 150 C196 118 226 108 250 106" fill="none" stroke="#bffcf5" stroke-width="7" stroke-linecap="round" opacity="0.5"/>

  <!-- the porthole lights up the dome -->
  <circle cx="256" cy="226" r="92" fill="#37f2df" opacity="0.45" filter="url(#glow)"/>

  <!-- side portholes -->
  <g stroke="#c8964a" stroke-width="6">
    <circle cx="160" cy="236" r="21" fill="#0d3b45"/>
    <circle cx="352" cy="236" r="21" fill="#0d3b45"/>
  </g>
  <circle cx="160" cy="236" r="10" fill="#37f2df" opacity="0.55"/>
  <circle cx="352" cy="236" r="10" fill="#37f2df" opacity="0.55"/>

  <!-- front porthole -->
  <circle cx="256" cy="226" r="66" fill="#0a2830" stroke="#c8964a" stroke-width="12"/>
  <circle cx="256" cy="226" r="54" fill="url(#glass)"/>
  <g stroke="#0a3a3e" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <path d="M256 174 L256 278"/>
    <path d="M204 226 L308 226"/>
  </g>
  <ellipse cx="236" cy="204" rx="16" ry="9" fill="#ffffff" opacity="0.75" transform="rotate(-30 236 204)"/>

  <!-- bubbles -->
  <g fill="none" stroke="#9ff8ee" stroke-width="4">
    <circle cx="392" cy="138" r="13"/>
    <circle cx="416" cy="94" r="8"/>
    <circle cx="400" cy="58" r="5"/>
  </g>
</svg>
